<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="NEXTOS: clean HyperOS and MIUI mod for Redmi" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0D10"/>
      <stop offset="1" stop-color="#16181F"/>
    </linearGradient>
  </defs>

  <rect width="960" height="420" fill="url(#bg)"/>

  <!-- Wordmark -->
  <text x="64" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-4" fill="#F2EFE8">NEXTOS</text>
  <rect x="66" y="196" width="0" height="3" rx="1.5" fill="#F5B841">
    <animate attributeName="width" from="0" to="72" dur="0.9s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="64" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#9AA0AE">Clean HyperOS and MIUI mod for Redmi</text>
  <text x="64" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5E6473">Sleek status bar, pill navigation, quiet settings</text>

  <!-- Phone -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" fill="freeze"/>

    <rect x="640" y="36" width="250" height="350" rx="38" fill="#15171C" stroke="#2C303A" stroke-width="2"/>
    <rect x="652" y="48" width="226" height="326" rx="28" fill="#0C0D10"/>
    <rect x="752" y="58" width="26" height="10" rx="5" fill="#000"/>

    <!-- Dual status bar, row 1: clock and battery -->
    <text x="668" y="95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F2EFE8">14:20</text>
    <rect x="826" y="83" width="28" height="14" rx="4" fill="none" stroke="#9AA0AE" stroke-width="1.5"/>
    <rect x="829" y="86" width="22" height="8" rx="2" fill="#F5B841">
      <animate attributeName="width" values="22;15;22" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="856" y="88" width="2" height="4" rx="1" fill="#9AA0AE"/>

    <!-- Dual status bar, row 2: notifications and signal -->
    <circle cx="672" cy="118" r="3.5" fill="#F5B841">
      <animate attributeName="r" values="3.5;4.5;3.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="684" cy="118" r="3.5" fill="#5E6473"/>
    <circle cx="696" cy="118" r="3.5" fill="#5E6473"/>
    <rect x="812" y="117" width="4" height="4" fill="#9AA0AE"/>
    <rect x="818" y="114" width="4" height="7" fill="#9AA0AE"/>
    <rect x="824" y="111" width="4" height="10" fill="#9AA0AE"/>
    <rect x="830" y="108" width="4" height="13" fill="#9AA0AE"/>
    <line x1="668" y1="134" x2="878" y2="134" stroke="#22252D" stroke-width="1"/>

    <!-- Content cards -->
    <rect x="668" y="150" width="210" height="56" rx="16" fill="#1B1E26"/>
    <circle cx="688" cy="178" r="10" fill="#2A2F3A"/>
    <rect x="706" y="170" width="88" height="7" rx="3.5" fill="#3A4050"/>
    <rect x="706" y="184" width="56" height="6" rx="3" fill="#2A2F3A"/>
    <rect x="834" y="170" width="30" height="16" rx="8" fill="#F5B841"/>
    <circle cx="857" cy="178" r="6" fill="#0C0D10"/>

    <rect x="668" y="218" width="210" height="56" rx="16" fill="#1B1E26"/>
    <circle cx="688" cy="246" r="10" fill="#2A2F3A"/>
    <rect x="706" y="238" width="100" height="7" rx="3.5" fill="#3A4050"/>
    <rect x="706" y="252" width="70" height="6" rx="3" fill="#2A2F3A"/>

    <rect x="668" y="286" width="210" height="30" rx="15" fill="#1B1E26"/>

    <!-- Floating pill tab bar with a sliding highlight -->
    <rect x="716" y="336" width="130" height="32" rx="16" fill="#1B1E26"/>
    <rect x="720" y="340" width="36" height="24" rx="12" fill="#F5B841" opacity="0.22">
      <animateTransform attributeName="transform" type="translate" values="0 0;34 0;68 0;102 0;68 0;34 0;0 0" keyTimes="0;0.17;0.33;0.5;0.67;0.83;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="738" cy="352" r="4" fill="#5E6473"/>
    <circle cx="772" cy="352" r="4" fill="#5E6473"/>
    <circle cx="806" cy="352" r="4" fill="#5E6473"/>
    <circle cx="840" cy="352" r="4" fill="#5E6473"/>
  </g>
</svg>
